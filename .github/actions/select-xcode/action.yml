name: Select Xcode
description: >-
  Selects the newest release of Xcode 26 and checks that it has Swift 6.3 or
  newer. Beta and release candidate apps are left out, so a new beta on the
  runner image cannot change CI without a pull request. mlx-swift declares
  swift-tools-version 6.3.
outputs:
  version:
    description: The Xcode version and build, for example 26.6-17F113. Cache keys use it.
    value: ${{ steps.select.outputs.version }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      run: |
        version=$(for app in /Applications/Xcode_26.*.app; do
          name=${app#/Applications/Xcode_}
          name=${name%.app}
          if [[ "$name" =~ ^26(\.[0-9]+)+$ ]]; then
            echo "$name"
          fi
        done | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
        if [ -z "$version" ]; then
          echo "::error::No release of Xcode 26 is on this runner."
          exit 1
        fi
        sudo xcode-select -s "/Applications/Xcode_$version.app"
        xcodebuild -version
        swift --version
        read -r major minor <<< "$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
        if ! (( major > 6 || (major == 6 && minor >= 3) )); then
          echo "::error::Xcode $version has Swift $major.$minor. mlx-swift needs Swift 6.3 or newer."
          exit 1
        fi
        echo "version=$(xcodebuild -version | awk 'NR == 1 { v = $2 } /Build version/ { b = $3 } END { print v "-" b }')" >> "$GITHUB_OUTPUT"
