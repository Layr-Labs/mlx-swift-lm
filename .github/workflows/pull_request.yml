name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2 # the merge commit and the tip of the base branch

      - name: Select the newest release of Xcode 26
        # Beta and release candidate apps are left out, so a new beta on the
        # runner image cannot change CI without a pull request.
        run: |
          version=$(for app in /Applications/Xcode_26.*.app; do
            name=${app#/Applications/Xcode_}
            name=${name%.app}
            if [[ "$name" =~ ^26(\.[0-9]+)+$ ]]; then
              echo "$name"
            fi
          done | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
          if [ -z "$version" ]; then
            echo "::error::No release of Xcode 26 is on this runner."
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_$version.app"
          xcodebuild -version
          swift format --version

      - name: Check the format of the Swift files that this pull request changes
        # Runs the formatter of .pre-commit-config.yaml with .swift-format on
        # the Swift files that the pull request adds or changes. The step
        # fails when the formatter changed a file. Main is not formatted, so
        # the step checks only the changed files. HEAD is the merge commit of
        # the pull request, and HEAD^1 is the tip of the base branch.
        run: |
          set -o pipefail
          git diff -z --name-only --diff-filter=ACMR HEAD^1...HEAD -- '*.swift' \
            | xargs -0 swift format format --in-place --configuration .swift-format
          git diff --exit-code
