name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2 # the merge commit and the tip of the base branch

      - name: Lint the Swift files that this pull request changes
        # The job uses the swift-format of the default Xcode and the rules in
        # .swift-format. It checks the files that .pre-commit-config.yaml
        # formats, the Swift files. Main is not clean under this command, so
        # the job checks only the Swift files that the pull request adds or
        # changes.
        run: |
          xcodebuild -version
          swift format --version
          git diff -z --name-only --diff-filter=d HEAD^1 HEAD -- '*.swift' > "$RUNNER_TEMP/changed-swift-files"
          if [ ! -s "$RUNNER_TEMP/changed-swift-files" ]; then
            echo "This pull request changes no Swift file."
            exit 0
          fi
          xargs -0 swift format lint --strict --configuration .swift-format < "$RUNNER_TEMP/changed-swift-files"
