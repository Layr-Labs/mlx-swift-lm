name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  # Chooses a Darkbloom Sandbox for the lint job when the Darkbloom plane
  # grants one, else the GitHub-hosted xcode-27 image.
  route:
    name: Route Lint
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        lint macos_arm64 xcode-27

  lint:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['lint'] }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2 # the merge commit and the tip of the base branch

      - name: Select Xcode
        # The formatter is the swift-format of the Xcode that this action
        # selects.
        uses: ./.github/actions/select-xcode

      - name: Show the formatter version
        run: swift format --version

      - name: Check the format of the Swift files that this pull request changes
        # Runs the formatter of .pre-commit-config.yaml with .swift-format on
        # the Swift files that the pull request adds or changes. The step
        # fails when the formatter changed a file. Main is not formatted, so
        # the step checks only the changed files. HEAD is the merge commit of
        # the pull request, and HEAD^1 is the tip of the base branch.
        run: |
          set -o pipefail
          git diff -z --name-only --diff-filter=ACMR HEAD^1...HEAD -- '*.swift' \
            | xargs -0 swift format format --in-place --configuration .swift-format
          git diff --exit-code
