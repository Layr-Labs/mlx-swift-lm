# Temporary hosted-only canary. Never merge this workflow replacement.
name: Hosted audio Xcode path canary (never merge)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: hosted-audio-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audio:
    name: Seven strict audio tests with verified Xcode path
    runs-on: xcode-27
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    steps:
    - name: Verify fixed native producer artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYCODE'
        import json,os,subprocess
        from pathlib import Path
        base='repos/Layr-Labs/mlx-swift-lm/actions/runs/43524527560'
        def get(path):return json.loads(subprocess.check_output(['gh','api',path],text=True))
        run=get(base)
        assert run['id']==43524527560 and run['run_attempt']==1
        assert run['head_sha']=='f8b003a700f6c48ade39a53b58c8e72842aedd98'
        assert run['repository']['full_name']=='Layr-Labs/mlx-swift-lm'
        assert run['workflow_id']==367192314 and run['path']=='.github/workflows/fork-tests.yml'
        jobs=get(base+'/jobs?per_page=100')['jobs']
        for name in ['Build','Metal library']:
            selected=[j for j in jobs if j['name']==name]
            assert len(selected)==1 and selected[0]['conclusion']=='success'
            assert selected[0]['runner_name'].startswith('darkbloom-')
        expected=[{'id': 14083339875, 'name': 'test-products', 'digest': 'sha256:f4db1facfd9586d2972026a7354aa56bb7f514afb0f6958e45a60efac8e3d496', 'size_in_bytes': 280167114}, {'id': 14085061063, 'name': 'metallib', 'digest': 'sha256:c8cd8ef6e7ea9163bbac1185ab85ebbcb13c0de69791c56b7e7d69396ba8053e', 'size_in_bytes': 75024002}, {'id': 14083629491, 'name': 'test-list', 'digest': 'sha256:2c57abbfdb4106e31fd61c0f561a94a0f792d5529b851c318285d20e3598c776', 'size_in_bytes': 140490}]
        found={a['id']:a for a in get(base+'/artifacts?per_page=100')['artifacts']}
        for item in expected:
            actual=found[item['id']]
            assert not actual['expired']
            for key,value in item.items():assert actual[key]==value,key
            assert actual['workflow_run']['id']==43524527560
            assert actual['workflow_run']['head_sha']==run['head_sha']
        Path(os.environ['RUNNER_TEMP'],'source-provenance.json').write_text(json.dumps({'run_id':run['id'],'head':run['head_sha'],'artifacts':expected},indent=2)+'\n')
        print('Verified fixed source, successful native producers and exact immutable artifacts.')
        PYCODE
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: f8b003a700f6c48ade39a53b58c8e72842aedd98
    - name: Select Xcode
      uses: ./.github/actions/select-xcode
    - name: Bridge the verified hosted Xcode installation to the build path
      env:
        BUILD_DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      run: |
        set -euo pipefail
        native_bundle=/Applications/Xcode_27.2.app
        hosted_bundle=/Applications/Xcode_27.2.0.app
        actual_developer_dir=${DEVELOPER_DIR:?}
        build_developer_dir=${BUILD_DEVELOPER_DIR:?}
        for path in "$actual_developer_dir" "$build_developer_dir"; do
          case "$path" in
            /Applications/Xcode_27.2.app/Contents/Developer|/Applications/Xcode_27.2.0.app/Contents/Developer) ;;
            *) echo "::error::Refusing an unexpected Xcode developer directory."; exit 1 ;;
          esac
        done
        expected_version=$'Xcode 27.2\nBuild version 27B52'
        actual_version=$(DEVELOPER_DIR="$actual_developer_dir" /usr/bin/xcodebuild -version)
        if [[ "$actual_version" != "$expected_version" ]]; then
          echo "::error::The hosted Xcode is not the required 27.2 build 27B52."
          exit 1
        fi
        if [[ "$actual_developer_dir" != "$build_developer_dir" ]]; then
          if [[ "$actual_developer_dir" != "$hosted_bundle/Contents/Developer" || "$build_developer_dir" != "$native_bundle/Contents/Developer" ]]; then
            echo "::error::Only the verified hosted-to-native Xcode path bridge is allowed."
            exit 1
          fi
          /usr/bin/python3 -I -S - "$hosted_bundle" <<'PY'
        import os,sys
        path=sys.argv[1]
        assert os.path.isdir(path) and not os.path.islink(path), 'Preinstalled Xcode must be a real directory'
        assert os.path.realpath(path)==path, 'Preinstalled Xcode path must resolve exactly'
        PY
          if [[ -e "$native_bundle" || -L "$native_bundle" ]]; then
            echo "::error::Refusing to overwrite an existing Xcode path."
            exit 1
          fi
          sudo -n /usr/bin/python3 -I -S - "$hosted_bundle" "$native_bundle" <<'PY'
        import os,sys
        # os.symlink fails atomically if any file, directory or symlink already exists.
        os.symlink(sys.argv[1],sys.argv[2])
        PY
          if [[ ! -L "$native_bundle" || "$(/usr/bin/readlink "$native_bundle")" != "$hosted_bundle" ]]; then
            echo "::error::The Xcode path bridge did not resolve to the verified installation."
            exit 1
          fi
        fi
        bridged_version=$(DEVELOPER_DIR="$build_developer_dir" /usr/bin/xcodebuild -version)
        if [[ "$bridged_version" != "$expected_version" ]]; then
          echo "::error::The bridged Xcode does not match 27.2 build 27B52."
          exit 1
        fi
        printf 'DEVELOPER_DIR=%s\n' "$build_developer_dir" >> "$GITHUB_ENV"
        printf 'Verified Xcode 27.2 (27B52): %s -> %s\n' "$actual_developer_dir" "$build_developer_dir"
    - name: Record hosted OS, hardware, Xcode and audio framework
      run: |
        set -euo pipefail
        {
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          xcodebuild -version
          swift -e 'import Foundation; import AVFoundation
          let bundle = Bundle(for: AVAssetReader.self)
          guard let version = bundle.object(forInfoDictionaryKey: "CFBundleVersion") else {
              fatalError("AVFoundation version is unavailable")
          }
          print("AVFoundation.bundle=\(bundle.bundlePath)")
          print("AVFoundation.version=\(version)")'
        } | tee "$RUNNER_TEMP/audio-identity.txt"
    - name: Verify unchanged audio selection and script identities
      run: |
        python3 - <<'PYCODE'
        import hashlib,json,sys
        from pathlib import Path
        expected={'.github/scripts/test_shards.py': 'e789cce3852b7d2679e15f09667d2bf1d0879966608b11301bbaaccb130aed3f', '.github/test-shards.json': 'f3ecf36bd8fd64df4d69249711b9c2d01dfa7168f7860f1c5b0a80f46a43344a'}
        for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
        sys.path.insert(0,'.github/scripts')
        import test_shards
        mapping=test_shards.load_map(Path('.github/test-shards.json'))
        assert len(mapping['hosted_tests'])==7
        assert [i for i,s in enumerate(mapping['shards'],1) if s.get('runner')=='hosted']==[5]
        print('Pinned source scripts/map and the exact seven hosted identities verified.')
        PYCODE
    - name: Download the test products
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ${{ runner.temp }}/test-products
        artifact-ids: '14083339875'
        github-token: ${{ github.token }}
        repository: Layr-Labs/mlx-swift-lm
        run-id: 43524527560
    - name: Restore products at the unchanged build workspace path
      env:
        BUILD_WORKSPACE: /Users/runner/actions-runner/_work/mlx-swift-lm/mlx-swift-lm
        BUILD_DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      run: |
        native_workspace=/Users/runner/actions-runner/_work/mlx-swift-lm/mlx-swift-lm
        case "$BUILD_DEVELOPER_DIR" in
          /Applications/Xcode_27.2.app/Contents/Developer|/Applications/Xcode_27.2.0.app/Contents/Developer) ;;
          *) echo "::error::Refusing an unexpected build developer directory."; exit 1 ;;
        esac
        if [[ "$DEVELOPER_DIR" != "$BUILD_DEVELOPER_DIR" ]]; then
          echo "::error::The hosted audio job must use the shared build's Xcode path."
          exit 1
        fi
        if [[ "$BUILD_WORKSPACE" == "$GITHUB_WORKSPACE" ]]; then
          : # The shared build also used the hosted runner workspace.
        elif [[ "$BUILD_WORKSPACE" == "$native_workspace" ]]; then
          if [[ -e "$native_workspace" || -L "$native_workspace" ]]; then
            echo "::error::Refusing an existing canonical build workspace."
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          mkdir -p "$(dirname "$native_workspace")"
          mkdir "$native_workspace"
          [[ -O "$native_workspace" ]]
          cp -a "$GITHUB_WORKSPACE/." "$native_workspace/"
          [[ $(git -C "$native_workspace" rev-parse HEAD) == "$source_sha" ]]
        else
          echo "::error::Refusing an unexpected build workspace."
          exit 1
        fi
        export GITHUB_WORKSPACE="$BUILD_WORKSPACE"
        printf 'AUDIO_WORKSPACE=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        cd "$GITHUB_WORKSPACE"
        .github/scripts/test-products.sh unpack "$RUNNER_TEMP/test-products/test-products.tar.zst"
    - name: Use the package versions of the build
      run: |
        cp "$AUDIO_WORKSPACE/.build/fork-tests-Package.resolved" "$AUDIO_WORKSPACE/Package.resolved"
    - name: Download the Metal library
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ${{ runner.temp }}/metallib
        artifact-ids: '14085061063'
        github-token: ${{ github.token }}
        repository: Layr-Labs/mlx-swift-lm
        run-id: 43524527560
    - name: Download the fixed producer test list
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '14083629491'
        github-token: ${{ github.token }}
        repository: Layr-Labs/mlx-swift-lm
        run-id: 43524527560
        path: ${{ runner.temp }}/fixed-test-list
    - name: Require identical producer test lists
      run: |
        cmp "$AUDIO_WORKSPACE/.build/fork-tests-list.txt" "$RUNNER_TEMP/fixed-test-list/tests.txt"
    - name: Run the shard
      run: |
        export GITHUB_WORKSPACE="$AUDIO_WORKSPACE"
        cd "$GITHUB_WORKSPACE"
        python3 -u .github/scripts/test_shards.py run --shard 5 --results "$RUNNER_TEMP/results/shard-5" --metallib "$RUNNER_TEMP/metallib/mlx.metallib" --list .build/fork-tests-list.txt
    - name: Verify all seven strict tests executed once without skips
      run: |
        python3 - <<'PYCODE'
        import json,os,sys
        from pathlib import Path
        root=Path(os.environ['AUDIO_WORKSPACE']);sys.path.insert(0,str(root/'.github/scripts'))
        import test_shards
        mapping=test_shards.load_map(root/'.github/test-shards.json');expected={test_shards.canonical(t) for t in mapping['hosted_tests']}
        folder=Path(os.environ['RUNNER_TEMP'])/'results/shard-5/shard5-run1'
        meta=json.loads((folder/'run.json').read_text());assert meta['status']==0 and meta['attempts']==1
        executed,skipped=test_shards.executed_tests(folder,listed=mapping['hosted_tests'])
        assert set(executed)==expected and all(len(v)==1 for v in executed.values())
        assert not skipped
        result={'source':'f8b003a700f6c48ade39a53b58c8e72842aedd98','test_count':7,'skipped':0,'identities':sorted(expected),'each_executed_once':True}
        Path(os.environ['RUNNER_TEMP'],'audio-verification.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps(result))
        PYCODE
    - name: Upload the test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: hosted-audio-boundary-results
        path: |-
          ${{ runner.temp }}/results
          ${{ runner.temp }}/audio-identity.txt
          ${{ runner.temp }}/source-provenance.json
          ${{ runner.temp }}/audio-verification.json
        retention-days: 7
    - name: Upload the crash reports
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: crash-reports-shard-5
        path: ~/Library/Logs/DiagnosticReports/*
        if-no-files-found: warn
        retention-days: 7
