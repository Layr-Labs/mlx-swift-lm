name: Fork Tests

# Builds the fork and runs its self-contained Metal test suites on a GitHub-hosted
# Mac. These suites use tiny test models. They need no model weights, no
# network access at test time, and no secrets. The job also reports the line
# coverage of the fork's sources.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  # A new push to a pull request cancels the older run. Runs on main are not
  # cancelled once they start.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test the suite runner scripts
        # Checks that scripts/run-nested-suite.sh fails when a suite executes
        # zero tests or skips a test, and that scripts/run-paged-kernel-tests.sh
        # runs both of its test processes. It uses a fake swift command.
        run: scripts/test-run-nested-suite.sh

      - name: Select an Xcode with Swift 6.3 or newer
        id: xcode
        # Selects the newest release of Xcode 26. Beta and release candidate
        # apps are left out, so a new beta on the runner image cannot change
        # CI without a pull request. mlx-swift declares swift-tools-version 6.3.
        run: |
          ls -d /Applications/Xcode*
          version=$(for app in /Applications/Xcode_26.*.app; do
            name=${app#/Applications/Xcode_}
            name=${name%.app}
            if [[ "$name" =~ ^26(\.[0-9]+)+$ ]]; then
              echo "$name"
            fi
          done | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
          if [ -z "$version" ]; then
            echo "::error::No release of Xcode 26 is on this runner."
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_$version.app"
          xcodebuild -version
          swift --version
          read -r major minor <<< "$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
          if ! (( major > 6 || (major == 6 && minor >= 3) )); then
            echo "::error::Xcode $version has Swift $major.$minor. mlx-swift needs Swift 6.3 or newer."
            exit 1
          fi
          xcrun -sdk macosx metal --version
          echo "version=$(xcodebuild -version | awk 'NR == 1 { v = $2 } /Build version/ { b = $3 } END { print v "-" b }')" >> "$GITHUB_OUTPUT"

      - name: Show the runner hardware
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          df -h "$GITHUB_WORKSPACE"

      - name: Restore the SwiftPM cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: spm-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-

      - name: Remove cached Metal libraries
        # A cached library can come from other MLX sources. A later step
        # builds a new one from the current sources. The unit test step
        # fails when the build folder contains any Metal library.
        run: |
          if [ -d .build ]; then
            find .build -type f -name '*.metallib' -delete
          fi

      - name: Build the package and its tests
        id: build
        # --enable-code-coverage instruments the test binaries. Every suite
        # step runs these instrumented binaries. Only the last test step
        # collects the coverage data and reports it.
        run: |
          start=$(date +%s)
          swift build --build-tests --enable-code-coverage
          elapsed=$(( $(date +%s) - start ))
          echo "swift build --build-tests --enable-code-coverage took $(( elapsed / 60 )) min $(( elapsed % 60 )) s"

      - name: Unit tests (no GPU)
        id: unit
        # Runs only the unit tests: the suites in the UnitTests suite that
        # the TestTypeTags.swift file of a test target declares. They have
        # the tag `unit`. swift test cannot select tests by tag, so the
        # filter selects the UnitTests suite of every test target. This
        # step runs before the Metal library exists, so it shows that these
        # tests need no Metal library. The step first checks that the build
        # folder contains no Metal library, and that each Swift file under
        # a Tests/<Target>/Unit folder is in the UnitTests suite.
        # scripts/run-nested-suite.sh fails the step when no test ran or a
        # test skipped.
        timeout-minutes: 10
        run: |
          if libraries=$(find .build -name '*.metallib' | grep .); then
            echo "Metal libraries in the build folder:"
            echo "$libraries"
            echo "::error::The build folder contains a Metal library before the unit tests."
            exit 1
          fi
          scripts/check-unit-test-files.sh
          scripts/run-nested-suite.sh '\.UnitTests/'

      - name: Build and stage the full Metal library
        id: metallib
        # Runs also when the unit tests failed, so that the other suites run.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          start=$(date +%s)
          scripts/build-metallib.sh "$RUNNER_TEMP/mlx.metallib"
          scripts/stage-test-metallib.sh "$RUNNER_TEMP/mlx.metallib" "$(swift build --show-bin-path)"
          elapsed=$(( $(date +%s) - start ))
          echo "The Metal library took $(( elapsed / 60 )) min $(( elapsed % 60 )) s"

      # One step for each suite, so the job summary shows which suite failed.
      # Each suite step runs when the Metal library step succeeded, also after
      # an earlier suite failed. scripts/run-nested-suite.sh fails the step
      # when the suite executed zero tests or skipped a test.

      - name: Run captured MiMo media and bounded vision regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 5
        run: scripts/run-nested-suite.sh 'MiMoV26(OpenRouterMedia|VisionWorkingSet|AudioWorkingSet)Tests' --no-parallel

      - name: Run native historical retention policy regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 5
        run: scripts/run-nested-suite.sh CBv2NativeHistoricalRetentionTests --no-parallel

      - name: Run demanded checkpoint partition and projection regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 5
        run: scripts/run-nested-suite.sh CBv2DemandedCheckpointPartitionTests --no-parallel

      - name: Run demanded long range continuation and projection regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 5
        run: scripts/run-nested-suite.sh CBv2DemandedCheckpointContinuationTests --no-parallel

      - name: Prepare asymmetric tiny MiMo native-retention fixture
        id: mimo-native-retention-fixture
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 5
        run: >-
          python3 scripts/prepare-mimo-native-retention-fixtures.py
          --output "$RUNNER_TEMP/mimo-native-retention" --asymmetric

      - name: Run native retained frontier after donor retirement
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' && steps.mimo-native-retention-fixture.outcome == 'success' }}
        timeout-minutes: 5
        env:
          MIMO_V26_SERIAL_NATIVE_TESTS: '1'
          MIMO_V26_SERIAL_LOAD_FIXTURES: ${{ runner.temp }}/mimo-native-retention
        run: >-
          scripts/run-nested-suite.sh
          MiMoV26NativeHistoricalRetentionTests.testDemandedMiddleFrontierSurvivesNativePublicationAndReopenedFork
          --no-parallel

      - name: Run CBv2PagedSafetyTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Runs the paged Metal kernels that are compiled at run time.
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2PagedSafetyTests

      - name: Run packed runtime KV and checkpoint regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          scripts/run-nested-suite.sh
          'CBv2RuntimeKVStorageTests|CBv2MixedQuantizedAttentionTests|CBv2QuantizedColdWindowLayoutTests|QuantizedCompleteCheckpointTests|Qwen3VLPagedQuantizedTests|PagedQuantizedKernelSmokeTests|Qwen4QuantizedSelectedPageCopiesTests|DiffusionGemmaQuantizedMediaChunkTests'
          --no-parallel

      - name: Run CBv2PrefixCacheHasherTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Checks the prompt hash of the prefix cache. Pure Swift.
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2PrefixCacheHasherTests

      - name: Run CBv2PagedEligibilityTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Checks the threadgroup memory budget. Pure Swift, no GPU work.
        timeout-minutes: 5
        run: scripts/run-nested-suite.sh CBv2PagedEligibilityTests

      - name: Run CBv2PagedBackendTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Checks the page pool, the page tables, the windowed rings, and the
        # backend lifecycle. Uses small MLX arrays.
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2PagedBackendTests

      - name: Run CBv2PagedKernelTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Compares the paged decode kernel with an fp32 reference, checks that
        # batch composition does not change the output, and runs a 200-step
        # greedy decode. The script runs the batch composition test in its
        # own process.
        timeout-minutes: 20
        run: scripts/run-paged-kernel-tests.sh

      - name: Run CBv2KVSharingParityTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Compares contiguous and paged KV storage on the tiny KV-sharing
        # model. A skip here means that the paged backend is not available.
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2KVSharingParityTests

      - name: Run CBv2SchedulerLoopTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Checks the CBv2 engine loop with a scripted model: admission,
        # waiting queue, cancellation, preemption, shutdown and watchdog.
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2SchedulerLoopTests

      # The next suites are the SDK suites that the Provider Tests job of
      # d-inference runs. They also use tiny test models.

      - name: Run SSMDecodeBoundsTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh SSMDecodeBoundsTests

      - name: Run NemotronHTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh NemotronHTests

      - name: Run NemotronH35BackendParityTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # This suite takes about 5 minutes on the hosted runner.
        timeout-minutes: 20
        run: scripts/run-nested-suite.sh NemotronH35BackendParityTests

      - name: Run NemotronH35StorageParityTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh NemotronH35StorageParityTests

      - name: Run NemotronH35MTPTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh NemotronH35MTPTests

      - name: Run NemotronH35MTPPrimingTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh NemotronH35MTPPrimingTests

      - name: Run MutableInputKernelTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh MutableInputKernelTests

      - name: Run MutableInputExportTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh MutableInputExportTests

      - name: Run CBv2QwenMTPIntegrationTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2QwenMTPIntegrationTests

      - name: Run CBv2MTPDepthControllerTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2MTPDepthControllerTests

      - name: Run PagedMTPBatchedColumnsTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh PagedMTPBatchedColumnsTests

      - name: Run CBv2CompleteCheckpointEngineTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh CBv2CompleteCheckpointEngineTests

      - name: Run demanded checkpoint and scheduler projection regressions
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          scripts/run-nested-suite.sh
          'CBv2(DemandedShortCheckpoint.*|CheckpointRetention|RecurrentCheckpointRetention|FirstTokenWorkProjection)Tests|HistoricalWindowCheckpoint(Engine)?Tests'
          --no-parallel

      - name: Run NemotronH35ProductionDefaultsTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh NemotronH35ProductionDefaultsTests

      - name: Run OpenAIServiceTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh OpenAIServiceTests

      - name: Run ToolCallParserIntegrationTests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        timeout-minutes: 10
        run: scripts/run-nested-suite.sh ToolCallParserIntegrationTests

      - name: Run all test suites once
        id: all-tests
        if: ${{ !cancelled() && steps.metallib.outcome == 'success' }}
        # Runs every suite in the package once, also the suites above, and
        # collects the coverage data. The step fails when a test fails, and
        # when XCTest or Swift Testing ran zero tests. It does not fail on
        # skipped tests, because some tests skip when they do not find model
        # weights or an environment variable. After a failure, it shows each
        # error line of the log as an annotation in the job summary. The step
        # first deletes coverage data that the SwiftPM cache can contain.
        #
        # --no-parallel, as in d-inference scripts/run-provider-tests.sh:
        # Swift Testing otherwise overlaps independent suites that share
        # process-wide MLX state and cooperative-executor capacity. Tests
        # still create their own tasks. A serial pass also makes a crash
        # attributable to one test.
        timeout-minutes: 120
        run: |
          set -o pipefail
          rm -rf "$(swift build --show-bin-path)/codecov"
          log=$RUNNER_TEMP/all-tests.log
          status=0
          swift test --skip-build --no-parallel --enable-code-coverage 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            # XCTest failures and crashes print "error:". Swift Testing
            # failures print "recorded an issue". A crash can print "signal
            # 11", "Segmentation fault" or "Fatal error". Any of them can
            # start in the middle of a line of other output, so the step
            # annotates the text from that point on. It leaves out the
            # "CoreData: error:" noise of the runner.
            grep -v 'CoreData: error:' "$log" \
              | grep -oE '(/[^ ]+:[0-9]+: )?error: .*|Test .+ recorded an issue.*|(Fatal error|Segmentation fault).*|(unexpected )?signal (code )?11.*' \
              | awk '!seen[$0]++' | head -n 50 \
              | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
            exit "$status"
          fi
          if ! grep -qE 'Executed [1-9][0-9]* tests?' "$log"; then
            echo "::error::XCTest executed zero tests."
            exit 1
          fi
          if ! grep -qE 'Test run with [1-9][0-9]* tests?' "$log"; then
            echo "::error::Swift Testing ran zero tests."
            exit 1
          fi

      - name: Upload the crash reports
        # A crash of a test process writes a report with the backtrace of
        # each thread to ~/Library/Logs/DiagnosticReports. The test log
        # names no test after a crash, so the report is the evidence.
        if: ${{ failure() && steps.all-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 7

      - name: Report the line coverage
        id: coverage
        if: ${{ !cancelled() && steps.all-tests.outcome == 'success' }}
        # Counts the Swift sources under Libraries/ only. The report leaves
        # out the test sources, the dependencies in .build and the benchmark
        # sources. The target is 80% line coverage. It is reported, not
        # enforced.
        timeout-minutes: 15
        run: |
          bin=$(swift build --show-bin-path)
          binary="$bin/mlx-swift-lmPackageTests.xctest/Contents/MacOS/mlx-swift-lmPackageTests"
          profile="$bin/codecov/default.profdata"
          # report DIR FILE writes the llvm-cov report for the Swift files
          # under DIR. llvm-cov ignores a path that does not exist and then
          # reports every file, so the function checks the path first.
          report() {
            if [ ! -d "$GITHUB_WORKSPACE/$1" ]; then
              echo "::error::The directory $1 does not exist."
              return 1
            fi
            xcrun llvm-cov report "$binary" \
              -instr-profile "$profile" \
              -ignore-filename-regex '/Tests/' \
              -ignore-filename-regex '/\.build/' \
              "$GITHUB_WORKSPACE/$1" > "$2"
          }
          # value_of FILE NAME prints the value of the column NAME in the
          # TOTAL row, for example "Lines" (a count) or "Lines Cover" (a
          # percentage). It finds the column by its name in the header row,
          # and it fails when the value is missing.
          value_of() {
            awk -v want="$2" '
              NR == 1 {
                field = 1
                for (i = 2; i <= NF; i++) {
                  if ($i == "Missed") { missed = 1; continue }
                  field++
                  if (missed) { missed = 0; continue }
                  if ($i == "Cover" || $i == "Executed") {
                    if (group " Cover" == want) col = field
                    continue
                  }
                  group = $i
                  if (group == want) col = field
                }
              }
              $1 == "TOTAL" && col { value = $col }
              END {
                if (want ~ / Cover$/ && value !~ /^[0-9.]+%$/) exit 1
                if (want !~ / Cover$/ && value !~ /^[0-9]+$/) exit 1
                print value
              }
            ' "$1" || { echo "::error::$1 has no $2 value in the TOTAL row." >&2; return 1; }
          }
          # row NAME DIR FILE prints one table row.
          row() {
            report "$2" "$3"
            grep '^TOTAL' "$3"
            lines=$(value_of "$3" "Lines Cover")
            regions=$(value_of "$3" "Regions Cover")
            functions=$(value_of "$3" "Functions Cover")
            echo "| $1 | $lines | $regions | $functions | 80% |" >> "$RUNNER_TEMP/coverage-rows.md"
          }
          : > "$RUNNER_TEMP/coverage-rows.md"
          row "All of \`Libraries/\`" Libraries "$RUNNER_TEMP/coverage-report.txt"
          for library in MLXLMCommon MLXLLM MLXVLM MLXLMServer MLXEmbedders; do
            row "\`Libraries/$library\`" "Libraries/$library" "$RUNNER_TEMP/coverage-$library.txt"
          done
          lines_total=$(value_of "$RUNNER_TEMP/coverage-report.txt" Lines)
          {
            echo "### Line coverage"
            echo
            echo "| Component | Lines | Regions | Functions | Target |"
            echo "|---|---|---|---|---|"
            cat "$RUNNER_TEMP/coverage-rows.md"
            echo
            echo "The denominator is the host Swift code under \`Libraries/\` that the test binary links: $lines_total lines. It leaves out \`Tests/\`, the dependencies in \`.build/\` and the benchmark code in \`Sources/\`."
            echo "The 45 metalKernel call sites in 26 Swift files compile Metal shader source from Swift strings. The shaders run on the GPU only, and no coverage tool can instrument them. The Swift lines that build and dispatch them are counted."
            echo "Swift emits no branch counters, so the Regions column is the proxy for branch coverage. The 80% target is reported only. The job does not fail below it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report.txt

      - name: Remove the Metal libraries and coverage data before saving
        # The next run builds its own Metal library and coverage data.
        if: ${{ !cancelled() && github.event_name == 'push' && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          find .build -type f -name '*.metallib' -delete
          rm -rf "$(swift build --show-bin-path)/codecov"

      - name: Save the SwiftPM cache
        # Save only on pushes to main. Pull requests only restore. Each push
        # to main saves a new entry, and a run restores the newest entry for
        # the same Xcode.
        if: ${{ !cancelled() && github.event_name == 'push' && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
