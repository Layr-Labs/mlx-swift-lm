# Temporary manual-only validation branch. Never merge this workflow replacement.
name: Native Linux helper canary (never merge)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: native-helper-canary-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fixture:
    name: Collect fixed successful run reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Require the exact successful native source run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYCODE'
        import json,os,subprocess
        from pathlib import Path
        repo='Layr-Labs/mlx-swift-lm'
        base=f'repos/{repo}/actions/runs/43520395494'
        def get(path):
            return json.loads(subprocess.check_output(['gh','api',path],text=True))
        source=get(base)
        assert source['id']==43520395494 and source['run_attempt']==1
        assert source['head_sha']=='1e736f037b942de83278f0923d61b349d9bff850'
        assert source['repository']['full_name']==repo
        assert source['workflow_id']==367192314 and source['path']=='.github/workflows/fork-tests.yml'
        assert source['status']=='completed' and source['conclusion']=='success', 'Source run must finish successfully first'
        jobs=get(base+'/jobs?per_page=100')['jobs']
        expected={'Build','Metal library','Coverage',*[f'Test shard {i}' for i in range(1,5)]}
        for name in expected:
            matches=[j for j in jobs if j['name']==name]
            assert len(matches)==1 and matches[0]['conclusion']=='success',name
            assert matches[0]['runner_name'].startswith('darkbloom-'),name
        for name in ['Check the shard map','Each test ran once']:
            assert any(j['name']==name and j['conclusion']=='success' for j in jobs),name
        artifacts=get(base+'/artifacts?per_page=100')['artifacts']
        wanted={'test-list',*[f'shard-{i}-results' for i in range(1,5)]}
        assert {a['name'] for a in artifacts if a['name'].startswith('shard-') and a['name'].endswith('-results')}==wanted-{'test-list'}
        selected=[]
        for name in sorted(wanted):
            matches=[a for a in artifacts if a['name']==name]
            assert len(matches)==1,name
            a=matches[0]
            assert not a['expired'] and 0<a['size_in_bytes']<100*1024**2,name
            assert a['workflow_run']['id']==43520395494 and a['workflow_run']['head_sha']==source['head_sha']
            selected.append({k:a[k] for k in ['id','name','size_in_bytes','digest']})
        assert sum(a['size_in_bytes'] for a in selected)<256*1024**2
        out=Path(os.environ['RUNNER_TEMP'])/'helper-fixture'
        out.mkdir()
        (out/'source.json').write_text(json.dumps({'run_id':43520395494,'run_attempt':1,'source_sha':source['head_sha'],'artifacts':selected},indent=2)+'\n')
        print('Pinned successful source run, seven native Mac jobs, and five authentic artifacts verified.')
        PYCODE
    - name: Download the authentic test list
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: test-list
        path: ${{ runner.temp }}/source-artifacts/test-list
        github-token: ${{ github.token }}
        repository: Layr-Labs/mlx-swift-lm
        run-id: 43520395494
    - name: Download the four authentic shard reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: shard-*-results
        merge-multiple: false
        path: ${{ runner.temp }}/source-artifacts
        github-token: ${{ github.token }}
        repository: Layr-Labs/mlx-swift-lm
        run-id: 43520395494
    - name: Keep and hash only the verification data
      run: |
        python3 - <<'PYCODE'
        import hashlib,json,os,re,shutil
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);source=base/'source-artifacts';out=base/'helper-fixture'
        listing=source/'test-list/tests.txt'
        assert listing.is_file() and not listing.is_symlink()
        shutil.copyfile(listing,out/'tests.txt')
        for shard in range(1,5):
            folder=source/f'shard-{shard}-results'
            assert folder.is_dir() and not folder.is_symlink()
            count=0
            for path in sorted(folder.rglob('*')):
                assert not path.is_symlink(), 'Refuse symlink in source report'
                if not path.is_file():continue
                if path.name!='run.json' and not re.fullmatch(r'(log-[0-9]+\.txt|events-[0-9]+\.jsonl)',path.name):continue
                assert path.stat().st_size<128*1024**2
                rel=path.relative_to(folder)
                target=out/'results'/f'shard-{shard}'/rel
                target.parent.mkdir(parents=True,exist_ok=True)
                shutil.copyfile(path,target)
                count+=1
            assert count>0,shard
        hashes={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()}
        assert len(hashes)>=12 and sum(p.stat().st_size for p in out.rglob('*') if p.is_file())<512*1024**2
        (out/'hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
        print(f'Collected {len(hashes)} data-only fixture files; no binaries or executable artifacts.')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: helper-fixture-43520395494-1e736f03
        path: ${{ runner.temp }}/helper-fixture
        retention-days: 7
  route:
    needs: fixture
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        shard-list linux_arm64 ubuntu-latest
        shard-verify linux_arm64 ubuntu-latest
  list:
    name: Native exact map check
    needs:
    - fixture
    - route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['shard-list'] }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 1e736f037b942de83278f0923d61b349d9bff850
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: helper-fixture-43520395494-1e736f03
        path: ${{ runner.temp }}/helper-fixture
    - name: Verify pinned source and data-only fixture integrity
      run: |
        python3 - <<'PYCODE'
        import hashlib,json,os,sys
        from pathlib import Path
        fixture=Path(os.environ['RUNNER_TEMP'])/'helper-fixture'
        source=json.loads((fixture/'source.json').read_text())
        assert source['run_id']==43520395494 and source['run_attempt']==1
        assert source['source_sha']=='1e736f037b942de83278f0923d61b349d9bff850'
        expected={'.github/scripts/test_shards.py':'14c427bc5ae45b378bf414eb0085dff5926cdbb7390ad20134a64c7952a5d469','.github/test-shards.json':'34ad2162b85c97bd9ea6ab0ce2a3e8e988e4b143d768bc6c8e9c230f184bf7aa'}
        for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
        hashes=json.loads((fixture/'hashes.json').read_text())
        files={str(p.relative_to(fixture)) for p in fixture.rglob('*') if p.is_file() and p.name!='hashes.json'}
        assert files==set(hashes)
        for rel,digest in hashes.items():
            path=fixture/rel
            assert not path.is_symlink() and path.resolve().is_relative_to(fixture.resolve())
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,rel
        sys.path.insert(0,'.github/scripts')
        import test_shards
        assert len(test_shards.read_list(fixture/'tests.txt'))==7718
        mapping=test_shards.load_map(Path('.github/test-shards.json'))
        expected_runs={run['id'] for run in test_shards.resolve_runs(mapping)}
        records=[json.loads(p.read_text()) for p in (fixture/'results').rglob('run.json')]
        assert len(records)==len(expected_runs)==10
        assert {r['id'] for r in records}==expected_runs
        assert all(r['status']==0 and r['attempts']==1 for r in records)
        print('Exact source scripts/map and all authentic fixture hashes verified.')
        PYCODE
    - name: Check all 7,718 identities exactly once
      run: |
        python3 .github/scripts/test_shards.py check --list "$RUNNER_TEMP/helper-fixture/tests.txt"
  verify:
    name: Native authentic report verification
    needs:
    - fixture
    - route
    - list
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['shard-verify'] }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 1e736f037b942de83278f0923d61b349d9bff850
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: helper-fixture-43520395494-1e736f03
        path: ${{ runner.temp }}/helper-fixture
    - name: Verify pinned source and data-only fixture integrity
      run: |
        python3 - <<'PYCODE'
        import hashlib,json,os,sys
        from pathlib import Path
        fixture=Path(os.environ['RUNNER_TEMP'])/'helper-fixture'
        source=json.loads((fixture/'source.json').read_text())
        assert source['run_id']==43520395494 and source['run_attempt']==1
        assert source['source_sha']=='1e736f037b942de83278f0923d61b349d9bff850'
        expected={'.github/scripts/test_shards.py':'14c427bc5ae45b378bf414eb0085dff5926cdbb7390ad20134a64c7952a5d469','.github/test-shards.json':'34ad2162b85c97bd9ea6ab0ce2a3e8e988e4b143d768bc6c8e9c230f184bf7aa'}
        for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
        hashes=json.loads((fixture/'hashes.json').read_text())
        files={str(p.relative_to(fixture)) for p in fixture.rglob('*') if p.is_file() and p.name!='hashes.json'}
        assert files==set(hashes)
        for rel,digest in hashes.items():
            path=fixture/rel
            assert not path.is_symlink() and path.resolve().is_relative_to(fixture.resolve())
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,rel
        sys.path.insert(0,'.github/scripts')
        import test_shards
        assert len(test_shards.read_list(fixture/'tests.txt'))==7718
        mapping=test_shards.load_map(Path('.github/test-shards.json'))
        expected_runs={run['id'] for run in test_shards.resolve_runs(mapping)}
        records=[json.loads(p.read_text()) for p in (fixture/'results').rglob('run.json')]
        assert len(records)==len(expected_runs)==10
        assert {r['id'] for r in records}==expected_runs
        assert all(r['status']==0 and r['attempts']==1 for r in records)
        print('Exact source scripts/map and all authentic fixture hashes verified.')
        PYCODE
    - name: Reject missing and duplicate reports; verify authentic reports
      run: |
        python3 - <<'PYCODE'
        import json,os,shutil,subprocess,sys
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);fixture=base/'helper-fixture';results=fixture/'results';proof=base/'helper-proof'
        proof.mkdir(exist_ok=True)
        main=next(p.parent for p in sorted(results.rglob('run.json')) if not (m:=json.loads(p.read_text()))['extra'] and not m['rest'])
        command=[sys.executable,'.github/scripts/test_shards.py','verify','--list',str(fixture/'tests.txt')]
        for kind,marker in [('missing','did not execute'),('duplicate','executed more than once')]:
            copy=base/f'negative-{kind}'
            shutil.copytree(results,copy)
            selected=copy/main.relative_to(results)
            if kind=='missing':shutil.rmtree(selected)
            else:shutil.copytree(selected,copy/'duplicate-main-run')
            env=dict(os.environ,GITHUB_STEP_SUMMARY='')
            r=subprocess.run(command+['--results',str(copy)],env=env,text=True,capture_output=True)
            (proof/f'{kind}.txt').write_text(r.stdout+r.stderr)
            assert r.returncode==1 and marker in r.stdout,kind
            print(f'Negative {kind} fixture correctly rejected.')
        r=subprocess.run(command+['--results',str(results),'--durations',str(proof/'test-durations.json')],text=True,capture_output=True)
        (proof/'positive.txt').write_text(r.stdout+r.stderr)
        print(r.stdout)
        assert r.returncode==0 and 'Each listed test executed exactly once' in r.stdout
        print('Authentic native test reports passed the original verifier on native Linux.')
        PYCODE
    - name: Keep positive and negative verification evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-helper-verification
        path: ${{ runner.temp }}/helper-proof
        retention-days: 7
