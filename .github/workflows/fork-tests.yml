name: Fork Tests

# Builds the fork and runs its self-contained Metal test suites on Macs. These
# suites use tiny test models. They need no model weights, no network access at
# test time, and no secrets. The workflow also reports the line coverage of the
# fork's sources.
#
# One job builds the package and its tests, and lists the tests. Another job
# builds the full Metal library at the same time. Both put their products in
# the Actions cache. The test jobs restore the products and run in parallel.
# Each test job runs one shard of .github/test-shards.json.
# .github/scripts/test_shards.py runs the shards and checks that each listed
# test runs exactly once.
#
# The route job selects the runner of each job: a Darkbloom Sandbox when the
# Darkbloom plane grants one, otherwise a Blacksmith runner
# (darkbloom-route.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  # A new push to a pull request cancels the older run. Runs on main are not
  # cancelled once they start.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Float32 parity oracles require full precision on TF32-capable GPUs.
  MLX_ENABLE_TF32: "0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Chooses a Darkbloom Sandbox or the Blacksmith fallback for each job below.
  # A lane is granted whole or falls back whole, so each test shard has its
  # own lane. The test-N lanes must match the shards in .github/test-shards.json.
  route:
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        plan linux_arm64 blacksmith-4vcpu-ubuntu-2404
        build macos_arm64 blacksmith-12vcpu-macos-27
        metallib macos_arm64 blacksmith-12vcpu-macos-27
        list linux_arm64 blacksmith-4vcpu-ubuntu-2404
        test-1 macos_arm64 blacksmith-12vcpu-macos-27
        test-2 macos_arm64 blacksmith-12vcpu-macos-27
        test-3 macos_arm64 blacksmith-12vcpu-macos-27
        test-4 macos_arm64 blacksmith-12vcpu-macos-27
        test-5 macos_arm64 blacksmith-12vcpu-macos-27
        test-6 macos_arm64 blacksmith-12vcpu-macos-27
        test-7 macos_arm64 blacksmith-12vcpu-macos-27
        test-8 macos_arm64 blacksmith-12vcpu-macos-27
        test-9 macos_arm64 blacksmith-12vcpu-macos-27
        test-10 macos_arm64 blacksmith-12vcpu-macos-27
        verify linux_arm64 blacksmith-4vcpu-ubuntu-2404
        coverage macos_arm64 blacksmith-12vcpu-macos-27

  plan:
    name: Shard map
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['plan'] }}
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test the shard tool
        run: python3 .github/scripts/test_shards_test.py

      - name: Read the shard numbers
        id: matrix
        run: echo "shards=$(python3 .github/scripts/test_shards.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['build'] }}
    timeout-minutes: 90
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    env:
      CCACHE_DIR: /Users/runner/Library/Caches/ccache-fork-tests
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      # SwiftPM compiles the C targets with -fmodules. ccache caches them
      # only with the modules sloppiness. The restored headers keep their
      # time stamps, so ccache can also ignore the header times.
      CCACHE_SLOPPINESS: modules,include_file_mtime,include_file_ctime,time_macros,pch_defines,system_headers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test the suite runner scripts
        # Checks that scripts/run-nested-suite.sh, which developers use to
        # run one suite, fails when a suite executes zero tests or skips a
        # test. It uses a fake swift command.
        run: scripts/test-run-nested-suite.sh

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/select-xcode

      - name: Show the runner hardware
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          df -h "$GITHUB_WORKSPACE"

      - name: Restore the build cache
        # The key ends with the commit. A run restores the newest build of
        # the same Xcode, and the build then recompiles only what changed.
        # The test jobs restore the entry that this job saves.
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: fork-build-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            fork-build-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift') }}-
            fork-build-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-

      - name: Restore the C and C++ compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/Library/Caches/ccache-fork-tests
          key: fork-ccache-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            fork-ccache-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-

      - name: Remove cached Metal libraries and coverage data
        # The metallib job builds the Metal library from the current sources.
        # The unit tests fail when the build folder contains a Metal library.
        # The package versions of the cached build go back to
        # Package.resolved. SwiftPM resolves again when Package.swift no
        # longer agrees with them.
        run: |
          if [ -d .build ]; then
            find .build -type f -name '*.metallib' -delete
            find .build -type d -name codecov -prune -exec rm -rf {} +
          fi
          if [ -f .build/fork-tests-Package.resolved ]; then
            cp .build/fork-tests-Package.resolved Package.resolved
          fi

      - name: Build the package and its tests
        id: build
        # --enable-code-coverage instruments the test binaries. The test jobs
        # write the coverage data, and the coverage job reports it.
        # -enable-incremental-file-hashing lets the Swift driver keep the
        # restored objects of a file whose content did not change. The
        # checkout gives every file a new modification time.
        # SwiftPM gives the C and C++ files to the compiler in CC, here
        # through ccache.
        run: |
          command -v ccache > /dev/null || brew install ccache
          ccache --zero-stats > /dev/null
          wrapper=$RUNNER_TEMP/ccache-clang
          printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -f clang)" > "$wrapper"
          chmod +x "$wrapper"
          start=$(date +%s)
          CC=$wrapper swift build --build-tests --enable-code-coverage --disable-index-store \
            -Xswiftc -enable-incremental-file-hashing
          elapsed=$(( $(date +%s) - start ))
          echo "swift build took $(( elapsed / 60 )) min $(( elapsed % 60 )) s"
          ccache --show-stats -v
          grep -oE 'Result: [a-z_ ]+' "$CCACHE_LOGFILE" | sort | uniq -c || true
          # The test jobs use the same package versions. Package.resolved
          # stays in .build, so the cache paths do not change.
          cp Package.resolved .build/fork-tests-Package.resolved
          du -sh .build ~/Library/Caches/org.swift.swiftpm "$CCACHE_DIR" || true
          echo "Build: $(( elapsed / 60 )) min $(( elapsed % 60 )) s (cache: ${{ steps.cache.outputs.cache-matched-key || 'none' }})" >> "$GITHUB_STEP_SUMMARY"
        env:
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log

      - name: List the tests
        # The test jobs select their tests from this list. The shard map
        # check uses it too.
        run: |
          set -o pipefail
          start=$(date +%s)
          swift test list --skip-build > .build/fork-tests-list.txt
          echo "swift test list took $(( $(date +%s) - start )) s and listed $(wc -l < .build/fork-tests-list.txt) lines"
          cp .build/fork-tests-list.txt "$RUNNER_TEMP/tests.txt"

      - name: Upload the test list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-list
          path: ${{ runner.temp }}/tests.txt
          retention-days: 7

      - name: Save the build cache
        # The test jobs and the next build restore this entry. An exact hit
        # means that the entry already exists.
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Save the C and C++ compiler cache
        if: ${{ steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/Library/Caches/ccache-fork-tests
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  metallib:
    name: Metal library
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['metallib'] }}
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/select-xcode

      - name: Read the mlx-swift revision
        id: pin
        run: |
          revision=$(grep -A 1 'github.com/Layr-Labs/mlx-swift.git' Package.swift | grep -oE '[0-9a-f]{40}' | head -n 1)
          if [ -z "$revision" ]; then
            echo "::error::Package.swift pins no mlx-swift revision."
            exit 1
          fi
          echo "mlx-swift $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore the Metal library
        # The library changes only when the mlx-swift pin, the Xcode or the
        # build script changes.
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metallib
          key: fork-metallib-v1-${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-${{ steps.pin.outputs.revision }}-${{ hashFiles('scripts/build-metallib.sh') }}

      - name: Build the full Metal library
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          xcrun -sdk macosx metal --version
          start=$(date +%s)
          swift package resolve
          scripts/build-metallib.sh "$RUNNER_TEMP/metallib/mlx.metallib"
          elapsed=$(( $(date +%s) - start ))
          echo "The Metal library took $(( elapsed / 60 )) min $(( elapsed % 60 )) s"

      - name: Save the Metal library
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metallib
          key: ${{ steps.cache.outputs.cache-primary-key }}

  list:
    name: Check the shard map
    needs: [build, route]
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['list'] }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the test list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-list
          path: ${{ runner.temp }}

      - name: Check that each test is in exactly one shard
        # Fails when a listed test is in no main run or in more than one.
        # A test that no shard names runs in the rest run, so this check
        # fails only when the map itself is wrong.
        run: python3 .github/scripts/test_shards.py check --list "$RUNNER_TEMP/tests.txt"

  test:
    name: Test shard ${{ matrix.shard }}
    needs: [plan, build, metallib, route]
    runs-on: ${{ fromJSON(needs.route.outputs.routes)[format('test-{0}', matrix.shard)] }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Use the package versions of the build
        run: cp .build/fork-tests-Package.resolved Package.resolved

      - name: Restore the Metal library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metallib
          key: ${{ needs.metallib.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run the shard
        # Runs each run of the shard in its own swift test process, also
        # after an earlier run failed. The runs without the Metal library go
        # first, then the script stages the library. A strict group fails
        # when it skips a test or executes zero tests. Every run fails when a
        # test fails. The job summary shows the time and result of each run.
        run: >-
          python3 -u .github/scripts/test_shards.py run --shard ${{ matrix.shard }}
          --results "$RUNNER_TEMP/results/shard-${{ matrix.shard }}"
          --metallib "$RUNNER_TEMP/metallib/mlx.metallib"
          --list .build/fork-tests-list.txt

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-${{ matrix.shard }}-results
          path: ${{ runner.temp }}/results
          retention-days: 7

      - name: Upload the crash reports
        # A crash of a test process writes a report with the backtrace of
        # each thread to ~/Library/Logs/DiagnosticReports. The test log
        # names no test after a crash, so the report is the evidence.
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reports-shard-${{ matrix.shard }}
          path: ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Each test ran once
    needs: [list, test, route]
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['verify'] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the test list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-list
          path: ${{ runner.temp }}/artifacts/test-list

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: shard-*-results

      - name: Check that each listed test executed exactly once
        # Reads the XCTest lines of each log and the Swift Testing report of
        # each run. Fails when a listed test did not execute in the main
        # pass, or executed in more than one main run. Writes the duration
        # of each test for test_shards.py plan.
        run: >-
          python3 .github/scripts/test_shards.py verify
          --list "$RUNNER_TEMP/artifacts/test-list/tests.txt"
          --results "$RUNNER_TEMP/artifacts"
          --durations "$RUNNER_TEMP/test-durations.json"

      - name: Upload the test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations
          path: ${{ runner.temp }}/test-durations.json
          retention-days: 30

  coverage:
    name: Coverage
    needs: [build, test, route]
    # The coverage is reported only, so the job also runs after a test
    # failure. It uses the coverage data of every run that finished.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['coverage'] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Use the package versions of the build
        run: cp .build/fork-tests-Package.resolved Package.resolved

      - name: Download the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: shard-*-results

      - name: Report the line coverage
        # Merges the coverage data of all shards. Counts the Swift sources
        # under Libraries/ only. The report leaves out the test sources, the
        # dependencies in .build and the benchmark sources. The target is 80%
        # line coverage. It is reported, not enforced.
        timeout-minutes: 15
        run: |
          bin=$(swift build --show-bin-path)
          binary="$bin/mlx-swift-lmPackageTests.xctest/Contents/MacOS/mlx-swift-lmPackageTests"
          profile="$RUNNER_TEMP/default.profdata"
          find "$RUNNER_TEMP/artifacts" -name coverage.profdata -print0 \
            | xargs -0 xcrun llvm-profdata merge -sparse -o "$profile"
          # report DIR FILE writes the llvm-cov report for the Swift files
          # under DIR. llvm-cov ignores a path that does not exist and then
          # reports every file, so the function checks the path first.
          report() {
            if [ ! -d "$GITHUB_WORKSPACE/$1" ]; then
              echo "::error::The directory $1 does not exist."
              return 1
            fi
            xcrun llvm-cov report "$binary" \
              -instr-profile "$profile" \
              -ignore-filename-regex '/Tests/' \
              -ignore-filename-regex '/\.build/' \
              "$GITHUB_WORKSPACE/$1" > "$2"
          }
          # value_of FILE NAME prints the value of the column NAME in the
          # TOTAL row, for example "Lines" (a count) or "Lines Cover" (a
          # percentage). It finds the column by its name in the header row,
          # and it fails when the value is missing.
          value_of() {
            awk -v want="$2" '
              NR == 1 {
                field = 1
                for (i = 2; i <= NF; i++) {
                  if ($i == "Missed") { missed = 1; continue }
                  field++
                  if (missed) { missed = 0; continue }
                  if ($i == "Cover" || $i == "Executed") {
                    if (group " Cover" == want) col = field
                    continue
                  }
                  group = $i
                  if (group == want) col = field
                }
              }
              $1 == "TOTAL" && col { value = $col }
              END {
                if (want ~ / Cover$/ && value !~ /^[0-9.]+%$/) exit 1
                if (want !~ / Cover$/ && value !~ /^[0-9]+$/) exit 1
                print value
              }
            ' "$1" || { echo "::error::$1 has no $2 value in the TOTAL row." >&2; return 1; }
          }
          # row NAME DIR FILE prints one table row.
          row() {
            report "$2" "$3"
            grep '^TOTAL' "$3"
            lines=$(value_of "$3" "Lines Cover")
            regions=$(value_of "$3" "Regions Cover")
            functions=$(value_of "$3" "Functions Cover")
            echo "| $1 | $lines | $regions | $functions | 80% |" >> "$RUNNER_TEMP/coverage-rows.md"
          }
          : > "$RUNNER_TEMP/coverage-rows.md"
          row "All of \`Libraries/\`" Libraries "$RUNNER_TEMP/coverage-report.txt"
          for library in MLXLMCommon MLXLLM MLXVLM MLXLMServer MLXEmbedders; do
            row "\`Libraries/$library\`" "Libraries/$library" "$RUNNER_TEMP/coverage-$library.txt"
          done
          lines_total=$(value_of "$RUNNER_TEMP/coverage-report.txt" Lines)
          {
            echo "### Line coverage"
            echo
            echo "| Component | Lines | Regions | Functions | Target |"
            echo "|---|---|---|---|---|"
            cat "$RUNNER_TEMP/coverage-rows.md"
            echo
            echo "The denominator is the host Swift code under \`Libraries/\` that the test binary links: $lines_total lines. It leaves out \`Tests/\`, the dependencies in \`.build/\` and the benchmark code in \`Sources/\`."
            echo "The 45 metalKernel call sites in 26 Swift files compile Metal shader source from Swift strings. The shaders run on the GPU only, and no coverage tool can instrument them. The Swift lines that build and dispatch them are counted."
            echo "Swift emits no branch counters, so the Regions column is the proxy for branch coverage. The 80% target is reported only. The job does not fail below it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report.txt
