# Temporary manual-only compatibility canary. Never merge this workflow replacement.
name: CodeQL three-language native canary (never merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        codeql-canary linux_arm64 ubuntu-22.04

  scan:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['codeql-canary'] }}
    timeout-minutes: 45
    steps:
      - name: Require a native canary runner
        env:
          NATIVE_RUNNER: ${{ runner.name }}
        run: |
          [[ "$NATIVE_RUNNER" == darkbloom-* ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 859f641529adc2f8fd011b8df295ee214d673060
          persist-credentials: false
      - name: Download the pinned ARM64 CodeQL bundle
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 600 --output codeql.tar.zst \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux-arm64.tar.zst
          echo '1c015b411c6e1c7f7e767eb8c9408fc6a2012d24d78b177cf22f29edc5772d10  codeql.tar.zst' | sha256sum --check
          tar --zstd -xf codeql.tar.zst
          "$RUNNER_TEMP/codeql/codeql" version --format=json
          "$RUNNER_TEMP/codeql/codeql" resolve languages
      - name: Scan with the current default language suites
        run: |
          set -euo pipefail
          codeql="$RUNNER_TEMP/codeql/codeql"
          mkdir "$RUNNER_TEMP/codeql-dbs" "$RUNNER_TEMP/codeql-results"
          for language in actions cpp python; do
            case "$language" in
              cpp) category=/language:c-cpp ;;
              *) category=/language:$language ;;
            esac
            "$codeql" database create "$RUNNER_TEMP/codeql-dbs/$language" \
              --source-root="$GITHUB_WORKSPACE" --language="$language" \
              --build-mode=none --threads=4 --ram=8192
            "$codeql" database analyze "$RUNNER_TEMP/codeql-dbs/$language" \
              --sarif-category="$category" --format=sarifv2.1.0 --output="$RUNNER_TEMP/codeql-results/$language.sarif" \
              --threads=4 --ram=8192
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codeql-results'
          result = {'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'languages': {}}
          categories = {'actions': '/language:actions', 'cpp': '/language:c-cpp', 'python': '/language:python'}
          for language in categories:
              data = json.loads((root / f'{language}.sarif').read_text())
              assert data['version'] == '2.1.0' and data['runs'], language
              assert all(run['automationDetails']['id'] == categories[language] + '/' for run in data['runs']), language
              rules = [rule for run in data['runs'] for rule in run['tool']['driver'].get('rules', [])]
              assert rules, language
              result['languages'][language] = {'category': categories[language], 'rules': len(rules), 'findings': sum(len(run.get('results', [])) for run in data['runs'])}
          (root / 'summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Keep canary results without publishing security alerts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-codeql-mlx-swift-lm-canary
          path: ${{ runner.temp }}/codeql-results/
          if-no-files-found: error
          retention-days: 3
